<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Bloxia · construis ta map Roblox en parlant</title>
<meta name="description" content="Décris ce que tu veux (des arbres, une montagne, un lac…) et vois-le apparaître sur ta map Roblox en 3D, en direct, comme dans un chat. Essaie le studio Bloxia.">
<meta name="theme-color" content="#9fd3ff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css"><link rel="stylesheet" href="/assets/css/studio.css"></head>
<body class="s3-body">
<header class="nav nav-float" id="nav"><div class="nav-bar">
  <a class="logo" href="/" aria-label="Bloxia"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l11 6.3-11 6.3L5 9.3z" fill="#c7d2fe"/><path d="M5 9.3l11 6.3v12.6L5 21.9z" fill="#4f6bed"/><path d="M27 9.3l-11 6.3v12.6l11-6.3z" fill="#2f3fa8"/></svg><span>Bloxia</span></a>
  <nav class="nav-center" aria-label="Navigation"><a href="/#comment">Comment ça marche</a><a href="/studio.html" aria-current="page">Studio</a><a href="/blog/">Ressources</a></nav>
  <div class="nav-actions"><a class="btn" href="/funnel.html" data-cta="studio-nav"><span class="lbl">Je crée mon jeu</span><i data-i="arrow-right"></i></a></div>
</div></header>

<main id="main"><div class="s3-stage">
  <div id="s3-canvas"><div id="s3-wait">Chargement…</div></div>
  <div class="s3-hud"><span class="s3-badge"><i data-i="wand"></i>Studio en direct · démo</span>
    <span class="s3-tools">
      <button id="s3-playbtn" class="s3-tool s3-tool-play"><i data-i="gamepad"></i><span>Jouer</span></button>
      <button id="s3-viewbtn" class="s3-tool" style="display:none"><i data-i="target"></i><span>1re pers.</span></button>
      <button id="s3-capture" class="s3-tool" title="Capturer l'écran"><i data-i="image"></i></button>
    </span></div>
  <div id="s3-hint" class="s3-hintbox"><b>Mode jeu</b> ZQSD / flèches pour marcher · Espace sauter · Maj courir · souris ou glisser pour regarder · <b style="display:inline;color:#fff">C</b> vue 1re/3e personne · Échap sortir</div>
  <div class="s3-skins" id="s3-skins">
    <span class="s3-skins-l">Skin</span>
    <button class="s3-skin on" data-skin="defaut">Défaut</button>
    <button class="s3-skin" data-skin="ninja">Ninja</button>
    <button class="s3-skin" data-skin="robot">Robot</button>
    <button class="s3-skin" data-skin="astronaute">Astronaute</button>
    <button class="s3-skin" data-skin="chevalier">Chevalier</button>
    <button class="s3-skin" data-skin="zombie">Zombie</button>
    <button class="s3-skin" data-skin="roi">Roi</button>
  </div>
  <div id="s3-pad" class="s3-pad" aria-hidden="true">
    <div class="s3-dpad"><button id="s3-f-up" class="s3-pbtn s3-up">▲</button>
      <button id="s3-f-left" class="s3-pbtn s3-left">◀</button>
      <button id="s3-f-right" class="s3-pbtn s3-right">▶</button>
      <button id="s3-f-down" class="s3-pbtn s3-down">▼</button></div>
    <button id="s3-f-jump" class="s3-jump">Saut</button>
  </div>

  <aside class="s3-chat">
    <div class="s3-chead"><span class="s3-dot"></span><b>Bloxia AI</b>
      <div class="s3-models"><button class="s3-model on" data-m="flash">Flash</button><button class="s3-model" data-m="pro">Pro</button><button class="s3-model" data-m="max">Max</button></div></div>
    <div class="s3-log" id="s3-log"></div>
    <div class="s3-chips">
      <button class="s3-chip" data-q="ajoute une forêt d'arbres">🌲 Forêt</button>
      <button class="s3-chip" data-q="ajoute une voiture">🚗 Voiture</button>
      <button class="s3-chip" data-q="ajoute un immeuble">🏢 Immeuble</button>
      <button class="s3-chip" data-q="ajoute une montagne">⛰️ Montagne</button>
      <button class="s3-chip" data-q="ajoute une côte avec la plage">🏖️ Côte</button>
      <button class="s3-chip" data-q="ajoute une route">🛣️ Route</button>
      <button class="s3-chip" data-q="ajoute un mur">🧱 Mur</button>
      <button class="s3-chip" data-q="ajoute un village avec une route">🏘️ Village</button>
      <button class="s3-chip" data-q="ajoute un château">🏰 Château</button>
      <button class="s3-chip" data-q="mets de la neige">❄️ Neige</button>
      <button class="s3-chip" data-q="la nuit tombe">🌙 Nuit</button>
    </div>
    <form class="s3-form" id="s3-form" autocomplete="off">
      <input id="s3-input" type="text" maxlength="90" placeholder="Décris ce que tu veux ajouter…" aria-label="Message">
      <button type="submit" aria-label="Envoyer"><i data-i="arrow-right"></i></button>
    </form>
    <div class="s3-foot"><button id="s3-reset" class="s3-reset"><i data-i="rotate"></i>Réinitialiser</button>
      <a class="btn btn-gold btn-sm" href="/funnel.html" data-cta="studio-cta"><span class="lbl">Je crée mon vrai jeu</span></a></div>
  </aside>
</div></main>
<script src="/assets/js/vendor/three.min.js"></script>
<script src="/assets/js/i18n.js"></script><script src="/assets/js/config.js"></script><script src="/assets/js/common.js"></script><script src="/assets/js/glyphs.js"></script><script src="/assets/js/studio3d.js"></script>
</body></html>
